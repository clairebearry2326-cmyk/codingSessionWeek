<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bar Graph</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f6fb;
        color: #20243a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: 32px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 48px rgb(34 44 82 / 10%);
      }

      h1 {
        margin: 0 0 24px;
        text-align: center;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .axis {
        stroke: #aeb5c7;
        stroke-width: 2;
      }

      .bar {
        fill: #5548e8;
        transition: y 250ms ease, height 250ms ease, fill 150ms ease;
      }

      .bar.active {
        fill: #e8872f;
      }

      .value {
        fill: #20243a;
        font-size: 20px;
        font-weight: 700;
        text-anchor: middle;
        transition: y 250ms ease;
      }

      #next {
        display: block;
        margin: 20px auto 0;
        padding: 12px 24px;
        border: 0;
        border-radius: 10px;
        background: #5548e8;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #next:focus-visible {
        outline: 3px solid #a9a2ff;
        outline-offset: 3px;
      }

      #next:disabled {
        cursor: default;
        opacity: 0.6;
      }

      #status {
        min-height: 3em;
        margin: 18px 0 0;
        color: #414963;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bar Graph</h1>
      <svg viewBox="0 0 400 320" role="img" aria-labelledby="chart-title chart-description">
        <title id="chart-title">Bar graph</title>
        <desc id="chart-description">
          A bar graph. Each bar's value is shown beneath it. The two bars being compared are highlighted.
        </desc>
        <line class="axis" x1="30" y1="250" x2="370" y2="250" />
        <rect class="bar" x="55" y="70" width="50" height="180" rx="6" />
        <rect class="bar" x="135" y="205" width="50" height="45" rx="6" />
        <rect class="bar" x="215" y="115" width="50" height="135" rx="6" />
        <rect class="bar" x="295" y="160" width="50" height="90" rx="6" />
        <text class="value" x="80" y="285">4</text>
        <text class="value" x="160" y="285">1</text>
        <text class="value" x="240" y="285">3</text>
        <text class="value" x="320" y="285">2</text>
      </svg>
      <button id="next" type="button">Next</button>
      <p id="status" role="status" aria-live="polite">
        Comparing 4 and 1. Click Next to compare them.
      </p>
    </main>
    <script>
      const values = [4, 1, 3, 2];
      const bars = document.querySelectorAll(".bar");
      const labels = document.querySelectorAll(".value");
      const nextButton = document.querySelector("#next");
      const status = document.querySelector("#status");
      let leftIndex = 0;
      let swappedThisPass = false;
      let finished = false;

      function updateChart() {
        values.forEach((value, index) => {
          const height = value * 45;
          bars[index].setAttribute("y", 250 - height);
          bars[index].setAttribute("height", height);
          bars[index].classList.toggle(
            "active",
            !finished && (index === leftIndex || index === leftIndex + 1),
          );
          labels[index].textContent = value;
        });
      }

      nextButton.addEventListener("click", () => {
        if (finished) {
          return;
        }

        const left = values[leftIndex];
        const right = values[leftIndex + 1];
        let message = `Compared ${left} and ${right}.`;

        if (left > right) {
          values[leftIndex] = right;
          values[leftIndex + 1] = left;
          swappedThisPass = true;
          message += ` Swapped them: ${values.join(", ")}.`;
        } else {
          message += " No swap needed.";
        }

        leftIndex += 1;
        if (leftIndex === values.length - 1) {
          if (!swappedThisPass) {
            finished = true;
            message = `Sorting complete! The numbers are sorted: ${values.join(", ")}.`;
            nextButton.disabled = true;
          } else {
            leftIndex = 0;
            swappedThisPass = false;
            message += ` Cycle complete. Starting from the left, compare ${values[0]} and ${values[1]}.`;
          }
        } else {
          message += ` Next compare ${values[leftIndex]} and ${values[leftIndex + 1]}.`;
        }

        updateChart();
        status.textContent = message;
      });

      updateChart();
    </script>
  </body>
</html>
